<script>
/* 全局错误隔离：未捕获异常顶部红条提示，避免白屏 */
window.addEventListener('error', function(e){
  try{
    var bar=document.getElementById('__errBar');
    if(!bar){ bar=document.createElement('div'); bar.id='__errBar'; bar.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#c62828;color:#fff;font-size:13px;line-height:1.5;padding:8px 12px;box-shadow:0 2px 8px rgba(0,0,0,.3)'; (document.body||document.documentElement).appendChild(bar); }
    bar.style.display='block';
    bar.textContent='⚠️ 页面出错：'+((e&&e.message)||'未知错误')+((e&&e.filename)?(' @ '+String(e.filename).split('/').pop()+':'+e.lineno):'');
  }catch(_){}
});
</script>

  .fit-tabs{display:flex;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
  .fit-tab{font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--terra-d);border-radius:10px;padding:9px 16px;transition:.15s}

  #fitTabMeal .ml-combo .ml-combo-block{margin:10px 0 4px}

        <div class="fit-checkin" id="fitCheckin"></div>
        <script>
        (function(){
          if(!document.getElementById('checkinStyle')){
            var s=document.createElement('style'); s.id='checkinStyle';
            s.textContent='.fit-checkin,.oral-checkin{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f1f8f3;border:1px solid #cfe3d2;border-radius:14px;padding:14px 18px;margin:6px 0 18px}.ci-left{display:flex;flex-direction:column;gap:3px}.ci-streak{font-size:17px;font-weight:700;color:#2e7d32}.ci-sub{font-size:12px;color:#5a6b5d}.ci-btn{padding:9px 18px;border:none;border-radius:10px;background:#2e7d32;color:#fff;font-size:14px;font-weight:600;cursor:pointer}.ci-btn.done{background:#9bbf9e}.ci-btn:hover{filter:brightness(.96)}';
            document.head.appendChild(s);
          }
          var KEY='fit_checkin';
          var box=document.getElementById('fitCheckin'); if(!box) return;
          function ymd(d){var y=d.getFullYear(),m=d.getMonth()+1,dd=d.getDate();return y+'-'+(m<10?'0'+m:m)+'-'+(dd<10?'0'+dd:dd);}
          function load(){try{var v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[];}catch(e){return [];}}
          function save(a){localStorage.setItem(KEY,JSON.stringify(a));}
          function streak(a){var set={};a.forEach(function(d){set[d]=1;});var t=new Date();t.setHours(0,0,0,0);var today=ymd(t);if(!set[today])t.setDate(t.getDate()-1);var n=0,c=new Date(t);while(set[ymd(c)]){n++;c.setDate(c.getDate()-1);}return n;}
          function render(){var arr=load();var today=ymd(new Date());var done=arr.indexOf(today)>=0;var st=streak(arr);
            box.innerHTML='<div class="ci-left"><div class="ci-streak">🔥 连续 '+st+' 天</div><div class="ci-sub">累计打卡 '+arr.length+' 次'+(done?' · 今天已打卡 ✓':'')+'</div></div><button class="ci-btn'+(done?' done':'')+'" id="fitCheckinBtn">'+(done?'✓ 今天已练':'今天练了，打卡')+'</button>';
            var btn=document.getElementById('fitCheckinBtn');
            btn.onclick=function(){var a=load();var t=ymd(new Date());var i=a.indexOf(t);if(i>=0){a.splice(i,1);}else{a.push(t);}save(a);render();};
          }
          render();
        })();
        </script>

    function _fsOpen(){return new Promise(function(res,rej){var r=indexedDB.open(_FS_DB,1);r.onupgradeneeded=function(){try{r.result.createObjectStore(_FS_STORE);}catch(e){}};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}

    async function _fsWrite(handle,data){var perm;try{perm=await handle.queryPermission({mode:'readwrite'});}catch(e){perm='denied';}if(perm!=='granted'){try{perm=await handle.requestPermission({mode:'readwrite'});}catch(e){perm='denied';}}if(perm!=='granted')return false;try{var w=await handle.createWritable();await w.write(JSON.stringify(data,null,2));await w.close();return true;}catch(e){return false;}}
    async function exportFixed(data,opts){opts=opts||{};if(!HAS_FSA){downloadBackup(data,'督学自动备份');return 'download';}var handle=await _fsGet();if(handle){var ok=await _fsWrite(handle,data);if(ok)return 'overwrite';}if(opts.silent)return 'none';try{handle=await window.showSaveFilePicker({suggestedName:'督学自动备份.json',types:[{description:'JSON 备份',accept:{'application/json':['.json']}}]});await _fsSet(handle);await _fsWrite(handle,data);return 'chosen';}catch(e){if(e&&e.name==='AbortError')return 'cancel';downloadBackup(data,'督学自动备份');return 'download';}}
    function autoBackup(){try{var data=buildBackup();localStorage.setItem('_fitAutoBackup',JSON.stringify(data));localStorage.setItem('_fitLastAutoBackupTs',String(Date.now()));if(HAS_FSA){exportFixed(data,{silent:true});}else{var now=Date.now();var lastDl=+(localStorage.getItem('_fitLastBackupDownloadTs')||0);if(now-lastDl>7*864e5){downloadBackup(data,'督学自动备份');localStorage.setItem('_fitLastBackupDownloadTs',String(now));}}markBackup(Date.now());}catch(e){}}

    function showLastBackup(){var el=document.getElementById('fitBackupInfo');if(!el)return;var ts=+(localStorage.getItem('_fitLastBackupTs')||0),ats=+(localStorage.getItem('_fitLastAutoBackupTs')||0),parts=[];if(ts)parts.push('上次手动：'+new Date(ts).toLocaleString());if(ats)parts.push('自动：'+new Date(ats).toLocaleString());el.innerHTML=parts.length?('<span style="color:#888">'+esc(parts.join(' ｜ '))+'</span>'):'<span style="color:#bbb">（未备份，点「📦 备份」）</span>';}
    async function exportBackup(){var data=buildBackup();var r=HAS_FSA?await exportFixed(data,{}):'download';if(r==='download'){downloadBackup(data,'督学自动备份');}markBackup(Date.now());showLastBackup();var tail=(r==='overwrite')?'（已自动覆盖到上次选的备份文件）':(r==='chosen')?'（已保存到所选位置，以后自动覆盖）':'（已下载为文件，建议存到 F:\\wokebuddy创造\\督学备份 并同名替换）';alert('✅ 已备份全部进度（含健身打卡、减脂餐偏好、四科进度）。\n'+tail);}
    function importBackup(file){var reader=new FileReader();reader.onload=function(){try{var data=JSON.parse(reader.result);var store=data.store||data;if(!data||data.__app!=='duban_backup'){alert('⚠️ 文件格式不对——这不是本工具的备份文件，导入已取消。');return;}if(!confirm('导入会【覆盖】当前浏览器里你的全部进度（含健身打卡）。\n\n确定继续吗？\n（建议先点「📦 备份」把当前数据也存一份）'))return;Object.keys(store).forEach(function(k){if(k&&BK_PREFIXES.some(function(p){return k.indexOf(p)===0;})){if(store[k]==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(store[k]));}});showLastBackup();alert('✅ 导入成功！进度已恢复，页面马上刷新。');location.reload();}catch(e){alert('⚠️ 导入失败：'+(e&&e.message||e));}};reader.readAsText(file);}
    var eb=document.getElementById('fitExportBtn');if(eb)eb.onclick=exportBackup;
    var ib=document.getElementById('fitImportBtn');if(ib)ib.onclick=function(){var f=document.getElementById('fitImportFile');if(f)f.click();};
    var iff=document.getElementById('fitImportFile');if(iff)iff.onchange=function(e){var f=e.target.files&&e.target.files[0];if(f)importBackup(f);e.target.value='';};
    showLastBackup();
  })();
  </script>
