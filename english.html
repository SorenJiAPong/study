<script>
/* 全局错误隔离：未捕获异常顶部红条提示，避免白屏（审计报告 #1） */
window.addEventListener('error', function(e){
  try{
    var bar=document.getElementById('__errBar');
    if(!bar){ bar=document.createElement('div'); bar.id='__errBar'; bar.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#c62828;color:#fff;font-size:13px;line-height:1.5;padding:8px 12px;box-shadow:0 2px 8px rgba(0,0,0,.3)'; (document.body||document.documentElement).appendChild(bar); }
    bar.style.display='block';
    bar.textContent='⚠️ 页面出错：'+((e&&e.message)||'未知错误')+((e&&e.filename)?(' @ '+String(e.filename).split('/').pop()+':'+e.lineno):'');
  }catch(_){}
});
</script>
<style>
  :root{
    --ink:#4F2B2B; --cream:#F7F1E4; --terra:#7A9E9D; --terra-d:#5E847F;
    --gray:#7A6A5A; --card:#FFFFFF; --line:#E8E3D5;
    --shadow:0 1px 4px rgba(79,43,43,.08);
    --radius:16px; --accent:#E9CA89;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--cream); color:var(--ink); line-height:1.7; -webkit-font-smoothing:antialiased;}
  .app{display:flex; min-height:100vh}
  /* Sidebar */
  .sidebar{width:264px; flex:0 0 264px; background:var(--ink); color:var(--cream);
    padding:26px 18px; display:flex; flex-direction:column; gap:6px;
    position:sticky; top:0; height:100vh; overflow-y:auto;}
  .brand{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-bottom:18px;padding:0 6px}
  .brand .logo{width:40px;height:40px;border-radius:50%;background:var(--terra) center/cover no-repeat;
    flex-shrink:0;cursor:pointer;transition:transform .15s;box-shadow:0 2px 6px rgba(0,0,0,.1)}
  .brand .logo:hover{transform:scale(1.05)}
  .brand b{font-size:17px;letter-spacing:.5px;margin-top:2px}
  .brand small{display:block;color:var(--gray);font-size:11px;font-weight:400}
  .nav-group{font-size:11px;color:var(--gray);letter-spacing:1px;margin:14px 8px 6px}
  .nav-btn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:transparent;border:0;color:var(--cream);cursor:pointer;
    padding:11px 12px;border-radius:11px;font-size:14.5px;font-family:inherit;transition:background .15s;
    text-decoration:none}
  .nav-btn .ico{width:20px;text-align:center;font-size:16px}
  .nav-btn:hover{background:rgba(255,255,255,.06)}
  .nav-btn.active{background:var(--terra);color:#fff;font-weight:600}
  .side-foot{margin-top:auto;font-size:11px;color:var(--gray);padding:10px 8px;line-height:1.5}
  /* Main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:12px;padding:14px 26px;
    background:var(--cream);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .menu-btn{display:none;background:var(--ink);color:#fff;border:0;width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer}
  .topbar h1{font-size:18px;font-weight:700}
  .topbar .sub{color:var(--gray);font-size:12.5px;margin-left:8px}
  .topbar .spacer{margin-left:auto}
  .topbar input.gs{width:260px;max-width:42vw;padding:9px 14px;border:1px solid var(--line);
    border-radius:30px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink)}
  .topbar input.gs:focus{outline:none;border-color:var(--terra)}
  .topbar .print-btn{border:1px solid var(--line);background:#fff;color:var(--terra-d);
    border-radius:30px;padding:8px 15px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .topbar .print-btn:hover{border-color:var(--terra)}
  .content{padding:24px 26px;max-width:1100px;width:100%;margin:0 auto}
  .page-title{font-size:23px;font-weight:700;margin-bottom:3px}
  .page-title .ac{color:var(--terra)}
  .page-desc{color:var(--gray);font-size:13px;margin-bottom:16px}
  /* tabs */
  .subtabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .sub-btn{background:#fff;border:1px solid var(--line);color:#5b544a;cursor:pointer;
    padding:7px 13px;border-radius:30px;font-size:13px;font-family:inherit;transition:.15s}
  .sub-btn:hover{border-color:var(--terra)}
  .sub-btn.active{background:var(--terra);color:#fff;border-color:var(--terra);font-weight:600}
  .sub-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  /* cards */
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
  .card h3{font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card h4{font-size:14.5px;margin:10px 0 6px;color:var(--terra-d)}
  .card p,.card li{font-size:14px;color:#4a443c}
  .tag{font-size:11px;background:var(--cream);color:var(--terra);padding:2px 9px;border-radius:20px;font-weight:600;border:1px solid var(--line)}
  .tag.g{background:#eef5ee;color:#3a7d44;border-color:#d9ecda}
  .tag.b{background:#eaf1fb;color:#2f6db5;border-color:#d6e6f7}
  ul.tight{list-style:none}
  ul.tight li{padding:5px 0 5px 18px;position:relative}
  ul.tight li:before{content:"▸";color:var(--terra);position:absolute;left:0;font-weight:700}
  .muted{color:var(--gray);font-size:12.5px}
  .callout{background:#fff7f2;border:1px solid #f3d9cb;border-left:4px solid var(--terra);
    border-radius:12px;padding:13px 15px;font-size:13.5px;margin:12px 0}
  .callout b{color:var(--terra-d)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
  th,td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
  th{background:var(--cream);color:var(--ink);font-weight:600}
  tr:nth-child(even) td{background:#fdfbf7}
  .en{font-style:italic;color:#3a352e}
  .sentence{background:#fdfbf7;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
  .example{background:#f3f8f3;border-left:3px solid #6aa86f;color:#3c5a3c;
    border-radius:0 8px 8px 0;padding:7px 11px;font-size:13px;margin-top:6px}
  .tip{background:#fff6ec;border-left:3px solid var(--terra);color:#8a4a25;
    border-radius:0 8px 8px 0;padding:6px 10px;font-size:12.5px;margin-top:6px}
  .pill{display:inline-block;background:var(--cream);color:var(--ink);border-radius:20px;
    padding:3px 11px;font-size:12px;margin:3px 5px 3px 0;border:1px solid var(--line)}
  /* item row with actions */
  .item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:11px;position:relative}
  .fav-cat-h{margin:20px 0 9px;padding-bottom:7px;border-bottom:2px solid var(--terra);font-size:15px;color:var(--ink);letter-spacing:.3px}
  .fav-cat-h:first-of-type{margin-top:8px}
  .fav-cat{display:block}
  .item .row1{display:flex;align-items:flex-start;gap:10px}
  .item .body{flex:1;min-width:0}
  .item .w{font-size:15.5px;font-weight:700;color:var(--ink)}
  .item .ph{font-size:12.5px;color:var(--gray);margin-left:6px}
  .item .pos{font-size:12px;color:var(--terra-d);font-weight:600;margin-left:6px}
  .item .mean{font-size:14px;color:#4a443c;margin-top:3px}
  .item .col{font-size:13px;color:#3a6a3a;margin-top:3px}
  .item .act{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
  .mini{border:1px solid var(--line);background:#fff;color:#7a7264;border-radius:20px;
    padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s}
  .mini:hover{border-color:var(--terra)}
  .mini.on{background:var(--terra);color:#fff;border-color:var(--terra);font-weight:600}
  .mini.fav.on{background:#f0b429;color:#fff;border-color:#f0b429}
  details{overflow-anchor:none;scroll-margin-top:12px}
  details > summary{scroll-margin-top:12px;cursor:pointer;list-style:none;font-weight:600;color:var(--terra-d)}
  details > summary::-webkit-details-marker{display:none}
  details > summary:before{content:"▸ ";}
  details[open] > summary:before{content:"▾ ";}
  /* progress */
  .bar{height:10px;background:var(--line);border-radius:20px;overflow:hidden;margin-top:7px}
  .bar > i{display:block;height:100%;background:var(--terra);transition:width .3s}
  .prow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .prow .pl{width:140px;font-size:14px;font-weight:600}
  .prow .pbar{flex:1}
  .prow .pn{font-size:12.5px;color:var(--gray);width:96px;text-align:right}
  /* today */
  .today-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .today-h .badge{background:var(--terra);color:#fff;border-radius:20px;padding:4px 13px;font-size:13px;font-weight:600}
  .seg{font-size:13px;color:var(--gray);margin:6px 0 10px}
  /* 用户自增专区 */
  .mine-box{border:1px solid #f0cdbd !important;background:#fffaf7}
  .mine-h{font-weight:600;color:#b5502c;font-size:14px;margin-bottom:8px}
  .ver-note{margin-top:16px;padding:10px 13px;border:1px dashed #d9c4b6;background:#fffaf7;border-radius:10px;font-size:12.5px;line-height:1.7;color:#7a5a48}
  .modal-err{display:none;color:#fff;background:#c0392b;border-radius:8px;padding:8px 11px;margin:10px 0 2px;font-size:13px}
  .mini.danger{background:#c0392b;border-color:#c0392b;color:#fff}
  .task{display:block;padding:8px 10px;margin:6px 0;border:1px solid var(--line);border-radius:9px;background:#fafcff;cursor:pointer;font-size:14px}
  .task input{margin-right:8px;transform:scale(1.15)}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .wday{border:1px solid var(--line);border-radius:9px;padding:7px 4px;text-align:center;background:#fafcff;font-size:12px}
  .wday.on{border-color:var(--terra);background:#fff2ec;box-shadow:0 0 0 2px rgba(192,90,63,.18)}
  .wday .wd{font-weight:600;color:var(--terra-d)}
  .wday .wp{font-size:13px;margin:3px 0;color:#b5502c;font-weight:600}
  .wday .wf{color:var(--gray);font-size:11px;line-height:1.3}
  @media(max-width:560px){ .week{grid-template-columns:repeat(4,1fr)} }
  /* search */
  .sres{padding:12px 0}
  .sres .sg{margin-bottom:18px}
  .sres .sg h4{font-size:15px;color:var(--terra-d);margin-bottom:8px;border-bottom:1px dashed var(--line);padding-bottom:5px}
  /* mobile */
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
  @media(max-width:820px){
    .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .2s}
    .sidebar.open{transform:translateX(0)}
    .menu-btn{display:block}
    .scrim.show{display:block}
    .content{padding:16px}
    .topbar{padding:12px 16px}
    .topbar input.gs{width:150px}
  }
  @media print{
    .sidebar,.topbar,.scrim,.subtabs,.sub-row,.item .act{display:none !important}
    .content{max-width:100%;padding:0}
    .card,.item{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
    body{background:#fff}
  }
  .en-box,.cn-box{margin:8px 0;border-radius:10px;padding:10px 12px}
  .en-box{background:#f3f7fb;border:1px solid #cfe0f0}
  .cn-box{background:#f6fbf3;border:1px solid #d4e8c8}
  .lbl{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--terra);border-radius:4px;padding:1px 7px;margin-bottom:5px}
  .cn-box .lbl{background:#5a9e3f}
  .en-txt{font-size:14px;line-height:1.7;color:#1b2733;white-space:pre-wrap}
  .cn-txt{font-size:14px;line-height:1.85;color:#2e4427;white-space:pre-wrap}
  .g-en{margin:2px 0}
  .g-cn{font-size:13px;line-height:1.7;color:#3a6b2c;margin:3px 0 6px;padding-left:6px;border-left:2px solid #cfe0c8}
  /* modal */
  .modal{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;padding:16px}
  .modal-bg{position:absolute;inset:0;background:rgba(44,39,32,.45)}
  .modal-box{position:relative;background:#fff;border-radius:16px;padding:22px;width:min(540px,94vw);max-height:88vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.32)}
  .modal-box h3{font-size:17px;margin-bottom:14px;color:var(--ink)}
  .mf{display:block;margin-bottom:11px}
  .mf>span{display:block;font-size:12.5px;color:#7a7264;margin-bottom:4px}
  .mf input,.mf textarea,.mf select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);box-sizing:border-box}
  .mf textarea{resize:vertical}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
</style>
</head>

<script>
(function(){
  "use strict";
  var D = window.POLITICS || {};
  var APP_VER = '2026-08-03 21:30';
  (function(){
    var note = document.getElementById('verNote');
    if(!note) return;
    var proto = location.protocol;
    var storeOk = true;
    try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch(e){ storeOk=false; }
    var msg;
    if(proto==='file:'){
      msg = '⚠️ 你正以 <b>本地文件(file://)</b> 打开，浏览器<b>不会保存</b>你添加的条目——刷新即丢失。请用顶部部署链接(https)打开才能真正保存。';
    } else if(!storeOk){
      msg = '⚠️ 当前环境禁用了本地存储，添加的条目仅本次会话有效，刷新后丢失。';
    } else {
      msg = '✅ 你添加的条目（短语/复现/作文/易混词/语法）保存在<b>此浏览器</b>，换设备/换浏览器不同步。数据版本 <b>'+APP_VER+'</b>。';
    }

  function parseConfInput(text){
    var POS_RE=/^(v\.?|vi\.?|vt\.?|n\.?|adj\.?|adv\.?|prep\.?|conj\.?|pron\.?|art\.?|int\.?|num\.?|c\.|u\.|sb\.?|sth\.?)$/i;
    var POS_CN={'动词':'v.','名词':'n.','形容词':'adj.','副词':'adv.','介词':'prep.','连词':'conj.','代词':'pron.','冠词':'art.','数词':'num.','感叹词':'int.'};
    var items=[];
    (text||'').split('\n').map(function(s){return s.trim();}).filter(Boolean).forEach(function(ln){
      var tokens, sep=' ';
      if(ln.indexOf('|')>=0){ tokens=ln.split('|'); sep='|'; }
      else if(ln.indexOf('、')>=0){ tokens=ln.split('、'); sep='、'; }
      else if(ln.indexOf('\t')>=0){ tokens=ln.split('\t'); sep='\t'; }
      else tokens=ln.split(/\s+/);
      tokens=tokens.map(function(t){return t.trim();}).filter(Boolean);
      if(!tokens.length) return;
      if(sep!==' '){
        var w0=tokens[0]||'';
        var pRaw=tokens[1]||'';
        var pos=(POS_RE.test(pRaw)||POS_CN[pRaw]!=null)?(POS_CN[pRaw]!=null?POS_CN[pRaw]:pRaw):'';
        var meaning=tokens.slice(2).filter(function(t){return /[一-龥]/.test(t);}).join('');
        if(!pos && /[一-龥]/.test(pRaw)) meaning=(pRaw+(meaning?' '+meaning:'')).trim();
        var example=tokens[tokens.length-1]||'';
        if(example===w0 || /[一-龥]/.test(example)) example='';
        if(w0) items.push({word:w0,pos:pos,meaning:meaning,example:example});
        return;
      }
      var posIdx=-1;
      tokens.forEach(function(t,i){ if(posIdx<0 && (POS_RE.test(t)||POS_CN[t]!=null)) posIdx=i; });
      var pos = posIdx>=0 ? (POS_CN[tokens[posIdx]]!=null?POS_CN[tokens[posIdx]]:tokens[posIdx]) : '';
      var word='';
      tokens.forEach(function(t,i){ if(i!==posIdx && !word && /^[a-z][a-z\-']*$/i.test(t)) word=t; });
      if(!word){ tokens.forEach(function(t){ if(!word && /^[a-z][a-z\-']*$/i.test(t)) word=t; }); }
      var removeIdx={}; if(posIdx>=0) removeIdx[posIdx]=1;
      tokens.forEach(function(t,i){ if(i!==posIdx && /[一-龥]/.test(t)) removeIdx[i]=1; });
      var wordIdx=-1;
      tokens.forEach(function(t,i){ if(wordIdx<0 && i!==posIdx && !removeIdx[i] && t===word) wordIdx=i; });
      if(wordIdx>=0) removeIdx[wordIdx]=1;
      var exTokens=[]; tokens.forEach(function(t,i){ if(!removeIdx[i]) exTokens.push(t); });
      var example=exTokens.join(' ').trim();
      if(example && !(example.split(/\s+/).length>=2 || /[.?!]$/.test(example))) example='';
      var meaning=tokens.filter(function(t,i){ return i!==posIdx && /[一-龥]/.test(t); }).join('');
      if(word) items.push({word:word,pos:pos,meaning:meaning,example:example});
    });
    return items;
  }

    else if(kind==='essay'){ var e=userEssay[idx]; if(e.golden) openEssay('golden', e.golden, idx); else if(e.templates) openEssay('templates', e.templates, idx); else openEssay('openclose', e.openclose, idx); }
    else if(kind==='conf') openConf(userConf[idx], idx);
    else if(kind==='grammar') openGrammar(userGrammar[idx], idx);
  }

  // ============ 渲染各模块 ============
  function render(){
    if(curTab==='grammar') return renderGrammar();
    if(curTab==='phrases') return renderPhrases();
    if(curTab==='essay') return renderEssay();
    if(curTab==='vocab') return renderVocab();
    if(curTab==='restate') return renderRestate();
    if(curTab==='confusables') return renderConfusables();
    if(curTab==='long') return renderLong();
    if(curTab==='tips') return renderTips();
    if(curTab==='doc') return renderEngDocList(panel);
    if(curTab==='today') return renderToday();
    if(curTab==='fav') return renderFav();
    if(curTab==='progress') return renderProgress();
    if(curTab==='search') return renderSearch(true);
  }

  // 分批渲染：先渲染前 RENDER_CHUNK 条，剩余用「加载更多」按需追加，避免一次生成几千个 DOM 卡顿
  var RENDER_CHUNK = 60;
  function chunkRender(panel, headerHtml, itemHtmls, footerHtml){
    var first = itemHtmls.slice(0, RENDER_CHUNK).join('');
    var rest = itemHtmls.slice(RENDER_CHUNK);
    var more = rest.length ? '<div style="text-align:center;margin:16px 0"><button class="sub-btn" id="__loadMore">⬇️ 加载更多（还剩 '+rest.length+' 条）</button></div>' : '';
    panel.innerHTML = headerHtml + first + more + (footerHtml||'');
    bindActs(panel); bindUserBtns(panel);
    var mb = panel.querySelector('#__loadMore');
    if(mb){
      mb.onclick = function(){
        mb.outerHTML = rest.join('');
        bindActs(panel); bindUserBtns(panel);
      };
    }
  }

  // 语法体系（支持用户自增改；顶部独立"我的语法"专区）
  function renderGrammar(){
    var types = ['全部','完形填空','语法填空','选句匹配'];
    subRow.innerHTML = types.map(function(t){
      return '<button class="sub-btn'+(t===grammarFilter?' active':'')+'" data-gf="'+t+'">'+t+'</button>';
    }).join('') + '<button class="sub-btn" id="addGrammarBtn" style="margin-left:auto;background:var(--terra);color:#fff;border-color:var(--terra)">➕ 我的语法</button>';
    subRow.querySelectorAll('[data-gf]').forEach(function(b){
      b.onclick=function(){ grammarFilter=b.getAttribute('data-gf'); subRow.innerHTML=''; renderGrammar(); };
    });
    var agb=document.getElementById('addGrammarBtn'); if(agb) agb.onclick=function(){ openGrammar(null,null); };

    // 合并：基础分类 + 用户分类（按 cat 归并，用户在前的独立块）
    function mineSection(){
      if(!userGrammar.length) return '';
      var h='<div class="card mine-box" style="margin-bottom:16px"><div class="mine-h">📌 我的语法 ('+userGrammar.length+')</div>';
      userGrammar.forEach(function(cf,i){
        h+='<div style="margin:8px 0;padding:8px 10px;border-left:3px solid #e07856;background:#fff7f2">'+
          '<div><b>'+esc(cf.cat)+'</b>'+(cf.title?' · '+esc(cf.title):'')+
          ' <span style="float:right">'+actBtns('grammar:u:'+i)+
          ' <button class="mini" data-edit-kind="grammar" data-edit-idx="'+i+'">✏️</button>'+
          ' <button class="mini" data-del-kind="grammar" data-del-idx="'+i+'">🗑️</button></span></div>'+
          (cf.commonIn&&cf.commonIn.length?'<div class="muted" style="font-size:12px">适用：'+esc(cf.commonIn.join('/'))+'</div>':'')+
          (cf.points||[]).map(function(p){
            return '<div class="mean" style="margin:3px 0">'+esc(p.text)+
              (p.example?' <span class="example">例：'+esc(p.example)+'</span>':'')+
              (p.tip?' <span class="tip">💡 '+esc(p.tip)+'</span>':'')+'</div>';
          }).join('')+
          '</div>';
      });
      return h+'</div>';
    }
    var html = mineSection();

    // 基础分类，并把同名用户分类的知识点并入
    (D.grammar||[]).forEach(function(cat, ci){
      var catIn = cat.commonIn || [];
      var pts = (cat.points||[]).filter(function(p){
        if(grammarFilter==='全部') return true;
        var inc = p.commonIn || catIn;
        return inc.indexOf(grammarFilter)>=0;
      });
      var userPts = [];
      userGrammar.forEach(function(ug){ if(ug.cat===cat.cat) userPts=userPts.concat(ug.points||[]); });
      if(!pts.length && !userPts.length) return;
      html += '<div class="card" style="margin-bottom:16px"><h3>'+esc(cat.cat)+' · '+esc(cat.title)+
        ' <span class="tag">'+esc((cat.commonIn||[]).join('/'))+'</span></h3>';
      pts.forEach(function(p, pi){
        var key='grammar:'+ci+':'+pi;
        html += '<div class="item"><div class="row1"><div class="body">'+
          '<div class="mean">'+esc(p.text)+'</div>'+
          (p.example?'<div class="example">例：'+esc(p.example)+'</div>':'')+
          (p.tip?'<div class="tip">💡 '+esc(p.tip)+'</div>':'')+
          '</div>'+actBtns(key)+'</div></div>';
      });
      userPts.forEach(function(p, pi){
        html += '<div class="item" style="background:#fff7f2;border-left:3px solid #e07856"><div class="row1"><div class="body">'+
          '<div class="mean">'+esc(p.text)+'</div>'+
          (p.example?'<div class="example">例：'+esc(p.example)+'</div>':'')+
          (p.tip?'<div class="tip">💡 '+esc(p.tip)+'</div>':'')+
          '</div></div></div>';
      });
      html += '</div>';
    });
    // 用户新建的、基础库没有的分类
    userGrammar.filter(function(ug){ return !(D.grammar||[]).some(function(c){return c.cat===ug.cat;}); }).forEach(function(cf, k){
      html += '<div class="card" style="margin-bottom:16px;background:#fff7f2;border-left:4px solid #e07856"><h3>📌 '+esc(cf.cat)+(cf.title?' · '+esc(cf.title):'')+
        ' <span class="tag">我的</span></h3>'+
        (cf.points||[]).map(function(p){
          return '<div class="item"><div class="row1"><div class="body">'+
            '<div class="mean">'+esc(p.text)+'</div>'+
            (p.example?'<div class="example">例：'+esc(p.example)+'</div>':'')+
            (p.tip?'<div class="tip">💡 '+esc(p.tip)+'</div>':'')+
            '</div></div></div>';
        }).join('')+'</div>';
    });
    if(!html) html='<div class="muted">该题型暂无对应语法点。</div>';
    panel.innerHTML = html;
    bindActs(panel); bindUserBtns(panel);
  }

  // 作文素材
  function renderEssay(){
    var subs=[{id:'golden',label:'高分句型'},{id:'templates',label:'万能模板'},{id:'openclose',label:'开头结尾'}];
    var addLabel = essaySub==='golden'?'➕ 我的金句':essaySub==='templates'?'➕ 我的模板':'➕ 我的开头结尾';
    subRow.innerHTML = subs.map(function(s){
      return '<button class="sub-btn'+(s.id===essaySub?' active':'')+'" data-es="'+s.id+'">'+s.label+'</button>';
    }).join('') + '<button class="sub-btn" id="addEssayBtn" style="margin-left:auto;background:var(--terra);color:#fff;border-color:var(--terra)">'+addLabel+'</button>';
    subRow.querySelectorAll('[data-es]').forEach(function(b){
      b.onclick=function(){ essaySub=b.getAttribute('data-es'); subRow.innerHTML=''; renderEssay(); };
    });
    var ab=document.getElementById('addEssayBtn'); if(ab) ab.onclick=function(){ openEssay(essaySub, null, null); };

      var arr=userEssay.filter(filterFn);

      arr.forEach(function(e){
        var idx=userEssay.indexOf(e);
        var key=(e.golden?'essay.golden:u:':e.templates?'essay.tpl:u:':'essay.oc:u:')+idx;
        var g=e.golden||e.templates||e.openclose;
        h+='<li><div class="g-en"><b>'+esc(g.sentence||g.text||g.en||'')+'</b>'+
          ' <span style="float:right">'+actBtns(key)+
          ' <button class="mini" data-edit-kind="essay" data-edit-idx="'+idx+'">✏️</button>'+
          ' <button class="mini" data-del-kind="essay" data-del-idx="'+idx+'">🗑️</button></span></div>'+
          (g.cn?'<div class="g-cn">'+esc(g.cn)+'</div>':'')+'</li>';
      });
      return h+'</ul></div>';
    }
    var html='';
    if(essaySub==='golden'){
      html+=mineBlock(function(e){return e.golden;});
      var cats={}; (D.essay.golden||[]).forEach(function(g){ (cats[g.cat]=cats[g.cat]||[]).push(g); });
      Object.keys(cats).forEach(function(c){
        html += '<div class="card" style="margin-bottom:14px"><h3>✨ '+esc(c)+'</h3><ul class="tight">';
        cats[c].forEach(function(g){
          var key='essay.golden:'+g.id;
          html += '<li><div class="g-en"><b>'+esc(g.sentence)+'</b>'+(g.example?' <span class="muted">（'+esc(g.example)+'）</span>':'')+
            ' <button class="mini fav'+(isF(key)?' on':'')+'" data-fav="'+esc(key)+'" style="display:inline-block;margin-left:6px">'+(isF(key)?'★':'☆')+'</button></div>'+
            (g.cn?'<div class="g-cn">'+esc(g.cn)+'</div>':'')+'</li>';
        });
        html += '</ul></div>';
      });
    } else if(essaySub==='openclose'){
      html+=mineBlock(function(e){return e.openclose;});
      var parts={};
      (D.essay.openClose||[]).forEach(function(o){ (parts[o.part]=parts[o.part]||[]).push(o); });
      Object.keys(parts).forEach(function(part){
        html += '<div class="card" style="margin-bottom:14px"><h3>'+(part==='开头'?'🚪':'🏁')+' '+esc(part)+'句</h3>';
        parts[part].forEach(function(o){
          html += '<h4 style="margin:10px 0 6px;color:var(--accent)">'+esc(o.scene)+'</h4><ul class="tight">';
          o.items.forEach(function(it, ii){
            var key='essay.oc:'+part+':'+o.scene+':'+ii;
            html += '<li><div class="g-en"><b>'+esc(it.en)+'</b> <button class="mini fav'+(isF(key)?' on':'')+'" data-fav="'+esc(key)+'" style="display:inline-block;margin-left:6px">'+(isF(key)?'★':'☆')+'</button></div>'+
              (it.cn?'<div class="g-cn">'+esc(it.cn)+'</div>':'')+'</li>';
          });
          html += '</ul>';
        });
        html += '</div>';
      });
    } else {
      html+=mineBlock(function(e){return e.templates;});
      (D.essay.templates||[]).forEach(function(t){
        var key='essay.tpl:'+(D.essay.templates.indexOf(t));
        html += '<div class="card essay-card" style="margin-bottom:14px"><h3>📐 '+esc(t.scene)+'</h3>'+
          '<div class="en-box"><div class="lbl">EN</div><div class="en-txt">'+esc(t.text)+'</div></div>'+

          actBtns(key)+'</div>';

    panel.innerHTML=html||'<div class="muted">无</div>'; bindActs(panel); bindUserBtns(panel);

      (it.ex?'<div class="example">例：'+esc(it.ex)+'</div>':'')+

  function addDays(base, n){ var d=new Date(base.getTime()); d.setDate(d.getDate()+n); return d; }

  function renderToday(){
    var LS_PLAN='eng_plan_';
    var today=new Date();
    var start=new Date(2026,6,29); // 2026-07-29
    var dayIdx=Math.max(0, Math.floor((today-start)/86400000));
    var wkIdx=((dayIdx%7)+7)%7;
    var dateStr=ymd(today);
    var planKey=LS_PLAN+dateStr;
    var done={}; try{ done=JSON.parse(localStorage.getItem(planKey))||{}; }catch(e){}
    function saveDone(){ try{ localStorage.setItem(planKey, JSON.stringify(done)); }catch(e){} }
    var tmpl=WEEK_PLAN[wkIdx];
    var html='<div class="today-h"><span class="badge">🎯 今日计划</span> <span class="muted">'+dateStr+' · 第 '+(dayIdx+1)+' 天 · '+esc(tmpl.day)+'（'+esc(tmpl.focus)+'）</span></div>';
    var total=tmpl.tasks.length, ok=0;
    html+='<div class="card" style="margin-bottom:14px"><div class="mine-h" style="margin-bottom:8px">✅ 今日任务清单（勾完即记录）</div>';
    tmpl.tasks.forEach(function(t,i){
      var checked=done[i]?true:false; if(checked) ok++;
      var cid='pt_'+i;
      html+='<label class="task" for="'+cid+'"><input type="checkbox" id="'+cid+'"'+(checked?' checked':'')+' data-task="'+i+'" /> <b>'+esc(t.mod)+'</b> · 目标 <b>'+t.n+'</b> 个 <span class="muted">（去对应模块标记"已熟"推进）</span></label>';
    });
    html+='<div class="prow" style="margin-top:10px"><div class="pl">完成度</div><div class="pbar"><div class="bar"><i style="width:'+Math.round(ok/total*100)+'%"></i></div></div><div class="pn">'+ok+'/'+total+' ('+Math.round(ok/total*100)+'%)</div></div>';
    html+='</div>';
    html+='<div class="card" style="margin-bottom:14px"><div class="mine-h" style="margin-bottom:8px">🗓️ 本周计划（高亮为今天）</div><div class="week">';
    WEEK_PLAN.forEach(function(w,i){
      var dk=LS_PLAN+ymd(addDays(start, dayIdx - wkIdx + i));
      var dd={}; try{ dd=JSON.parse(localStorage.getItem(dk))||{}; }catch(e){}
      var dt=w.tasks.length, ddone=0; w.tasks.forEach(function(t,j){ if(dd[j]) ddone++; });
      html+='<div class="wday'+(i===wkIdx?' on':'')+'"><div class="wd">'+esc(w.day)+'</div><div class="wp">'+ddone+'/'+dt+'</div><div class="wf">'+esc(w.focus)+'</div></div>';
    });
    html+='</div></div>';
    // 顺序推进复习卡
    var gPool=[]; (D.grammar||[]).forEach(function(cat,ci){ (cat.points||[]).forEach(function(p,pi){ gPool.push({key:'grammar:'+ci+':'+pi, text:p.text}); }); });
    var pPool=[]; (D.phrases||[]).forEach(function(p){ pPool.push({key:'phrases:'+p.id, text:p.phrase+' — '+p.meaning}); });
    var rPool=[]; (D.restateReplace||[]).forEach(function(b){ (b.items||[]).forEach(function(it,i){ rPool.push({key:'restate:'+b.part+':'+i, text:it.type+'：'+it.en}); }); });
    var cPool=[]; (D.confusables||[]).forEach(function(cf){ cPool.push({key:'conf:'+cf.group.join('-'), text:cf.group.join('/')}); });
    function pick(pool,n){ var out=[]; for(var i=0;i<pool.length&&out.length<n;i++){ if(!isM(pool[i].key)) out.push(pool[i]); } return out; }
    var g=pick(gPool,3), p=pick(pPool,5), r=pick(rPool,2), c=pick(cPool,3);
    html+='<div class="seg">📚 语法点（顺序推进 3）</div>'; g.forEach(function(x){ html+=todayCard(x); });
    html+='<div class="seg">🔗 短语（顺序推进 5）</div>'; p.forEach(function(x){ html+=todayCard(x); });
    html+='<div class="seg">🔁 复现替换（顺序推进 2）</div>'; r.forEach(function(x){ html+=todayCard(x); });
    html+='<div class="seg">⚠️ 易混词（顺序推进 3）</div>'; c.forEach(function(x){ html+=todayCard(x); });
    if(!g.length&&!p.length&&!r.length&&!c.length) html+='<div class="callout">🎉 今日复习项都标过"已熟"啦！可去具体模块继续巩固或重置。</div>';
    panel.innerHTML=html;
    panel.querySelectorAll('[data-task]').forEach(function(cb){
      cb.onchange=function(){ var i=+cb.getAttribute('data-task'); if(cb.checked) done[i]=1; else delete done[i]; saveDone(); renderToday(); };
    });
    bindActs(panel);
  }

    var CATS=[
      {key:'grammar', label:'📚 语法体系'},

      {key:'other',   label:'📦 其它'}
    ];
    function catOf(k){
      if(k.indexOf('grammar')===0) return 'grammar';
      if(k.indexOf('phrases')===0) return 'phrases';
      if(k.indexOf('vocab')===0) return 'vocab';
      if(k.indexOf('essay.')===0) return 'essay';

      if(k.indexOf('tips')===0) return 'tips';
      if(k.indexOf('today')===0) return 'today';
      if(k.indexOf('doc')===0) return 'doc';
      return 'other';

    keys.forEach(function(k){ var c=catOf(k); (groups[c]=groups[c]||[]).push(k); });

      html+='<h3 class="fav-cat-h">'+cat.label+' <span class="muted">('+g.length+')</span></h3><div class="fav-cat">';

      html+='</div>';

  function favCard(k){

  }
  function favBody(k){
    // 易混词整组：基础库 conf:group / 用户 uc:i
    var m = k.match(/^conf:(.+)$/);
    if(m){
      var gname = m[1];
      var cf = (D.confusables||[]).find(function(c){ return c.group.join('-') === gname; });
      if(cf){
        var rows = cf.items.map(function(it){ return '<tr><td><b>'+esc(it.word)+'</b></td><td>'+esc(it.pos||'')+'</td><td>'+esc(it.meaning||'')+'</td><td class="en">'+esc(it.example||'')+'</td></tr>'; }).join('');
        return '<div class="w">⚠️ '+cf.group.map(function(w){return esc(w);}).join(' <span class="muted">vs</span> ')+'</div><table style="margin-top:6px">'+rows+'</table>'+(cf.tip?'<div class="tip">💡 '+esc(cf.tip)+'</div>':'');
      }
    }
    var um = k.match(/^uc:(\d+)$/);
    if(um){
      var idx = parseInt(um[1],10);
      var cf = userConf[idx];
      if(cf){
        var rows = cf.items.map(function(it){ return '<tr><td><b>'+esc(it.word)+'</b></td><td>'+esc(it.pos||'')+'</td><td>'+esc(it.meaning||'')+'</td><td class="en">'+esc(it.example||'')+'</td></tr>'; }).join('');
        return '<div class="w">⚠️ '+cf.group.map(function(w){return esc(w);}).join(' <span class="muted">vs</span> ')+'</div><table style="margin-top:6px">'+rows+'</table>'+(cf.tip?'<div class="tip">💡 '+esc(cf.tip)+'</div>':'');
      }
    }
    // 其他模块保持原样
    if(k.indexOf('phrases:')===0){
      var pid = k.slice(8);

      if(p) return '<div class="w">'+esc(p.phrase)+'</div><div class="mean">'+esc(p.meaning)+'</div>';
    }
    if(k.indexOf('vocab:')===0){
      var vid = k.slice(6);

      if(v) return '<div class="w">'+esc(v.word)+'</div><div class="mean">'+esc(v.meaning)+'</div>'+(v.colloc?'<div class="col">'+esc(v.colloc)+'</div>':'');
    }

      var gid = k.slice(13);
      var g = (D.essay.golden||[]).find(function(x){return String(x.id)===gid;});
      if(g) return '<div class="mean"><b>'+esc(g.sentence)+'</b></div>'+(g.example?'<div class="example">'+esc(g.example)+'</div>':'')+(g.cn?'<div class="tip">'+esc(g.cn)+'</div>':'');
    }
    if(k.indexOf('essay.tpl:')===0){
      var ti = parseInt(k.slice(10),10);

    }
    if(k.indexOf('essay.oc:')===0){
      var parts = k.split(':');
      var o = ((D.essay.openClose||[]).find(function(x){return x.part===parts[1]&&x.scene===parts[2];})||{}).items[parseInt(parts[3],10)];
      if(o) return '<div class="mean"><b>'+esc(o.en)+'</b></div>'+(o.cn?'<div class="tip">'+esc(o.cn)+'</div>':'');
    }
    if(k.indexOf('restate:')===0){
      var parts = k.split(':');
      var it = ((D.restateReplace||[]).find(function(b){return b.part===parts[1];})||{}).items[parseInt(parts[2],10)];
      if(it) return '<div class="mean"><b>'+esc(it.type||'')+'</b> · '+esc(it.en||'')+'</div>'+(it.cn?'<div class="tip">'+esc(it.cn)+'</div>':'');
    }
    if(k.indexOf('long:')===0){

    }
    if(k.indexOf('grammar:')===0){
      var parts = k.split(':');

      if(p) return '<div class="mean">'+esc(p.text)+'</div>'+(p.example?'<div class="example">'+esc(p.example)+'</div>':'');

  function bindSafeInput(input, cb){
    var t=null, composing=false;
    input.addEventListener('compositionstart', function(){ composing=true; });
    input.addEventListener('compositionend', function(){ composing=false; if(t) clearTimeout(t); t=setTimeout(function(){ cb(input.value); }, 200); });
    input.addEventListener('input', function(){ if(composing) return; if(t) clearTimeout(t); t=setTimeout(function(){ cb(input.value); }, 200); });
  }

  async function _fsGet(){ try{ var db=await _fsOpen(); return await new Promise(function(res){ var t=db.transaction(_FS_STORE,'readonly').objectStore(_FS_STORE).get(_FS_K); t.onsuccess=function(){ res(t.result||null); }; t.onerror=function(){ res(null); }; }); }catch(e){ return null; } }
  async function _fsSet(h){ try{ var db=await _fsOpen(); await new Promise(function(res){ var t=db.transaction(_FS_STORE,'readwrite').objectStore(_FS_STORE).put(h,_FS_K); t.onsuccess=function(){ res(); }; t.onerror=function(){ res(); }; }); }catch(e){} }

  async function _fsWrite(handle,data){
    var perm; try{ perm=await handle.queryPermission({mode:'readwrite'}); }catch(e){ perm='denied'; }
    if(perm!=='granted'){ try{ perm=await handle.requestPermission({mode:'readwrite'}); }catch(e){ perm='denied'; } }
    if(perm!=='granted') return false;
    try{ var w=await handle.createWritable(); await w.write(JSON.stringify(data,null,2)); await w.close(); return true; }catch(e){ return false; }
  }

  function importEItem(it){
    if(it.type==='raw'){
      if(!it.content && !it.title) return 'bad';
      if(userDoc.some(function(u){return u.title===(it.title||'')&&u.content===(it.content||'');})) return 'skip';
      userDoc.push({title:it.title||'导入文档', content:it.content||'', date:new Date().toISOString().slice(0,10)});
      saveArr(LS_UD,userDoc); return 'ok';
    }
    var ts=Date.now();
    if(it.type==='grammar'){
      var pts=(it.points||[]).map(function(p){return {text:p.text||'', example:p.example||'', tip:p.tip||''};}).filter(function(p){return p.text;});
      if(!pts.length) return 'bad';
      var rec={cat:it.cat||'其他', title:it.title||'', commonIn:it.commonIn||[], points:pts, mine:true};
      if(userGrammar.some(function(u){return u.cat===rec.cat && (u.title||'')===(rec.title||'') && (u.points[0]||{}).text===(pts[0]||{}).text;})) return 'skip';
      userGrammar.push(rec); saveArr(LS_UG,userGrammar); return 'ok';
    }
    if(it.type==='phrases'){
      if(!it.phrase||!it.meaning) return 'bad';
      if(userPhrases.some(function(u){return u.phrase===it.phrase&&u.meaning===it.meaning;})) return 'skip';
      userPhrases.push({id:'u'+ts, group:it.group||'其他', phrase:it.phrase, meaning:it.meaning, example:it.example||'', mine:true}); saveArr(LS_UP,userPhrases); return 'ok';
    }
    if(it.type==='essay_golden'){
      if(!it.sentence) return 'bad';
      if(userEssay.some(function(u){return u.golden&&u.golden.sentence===it.sentence;})) return 'skip';
      userEssay.push({golden:{id:'u'+ts, cat:it.cat||'我的金句', sentence:it.sentence, cn:it.cn||'', example:it.example||'', mine:true}}); saveArr(LS_UE,userEssay); return 'ok';
    }
    if(it.type==='essay_tpl'){
      if(!it.text) return 'bad';
      if(userEssay.some(function(u){return u.templates&&u.templates.text===it.text;})) return 'skip';
      userEssay.push({templates:{scene:it.scene||'我的模板', text:it.text, cn:it.cn||'', mine:true}}); saveArr(LS_UE,userEssay); return 'ok';
    }
    if(it.type==='confusables'){
      if(!it.group||!it.group.length) return 'bad';
      var items=(it.items||[]).map(function(x){return {word:x.word||'',pos:x.pos||'',meaning:x.meaning||'',example:x.example||''};}).filter(function(x){return x.word;});
      if(!items.length) return 'bad';
      if(userConf.some(function(u){return u.group.join('/')===it.group.join('/');})) return 'skip';
      userConf.push({group:it.group, items:items, tip:it.tip||'', mine:true}); saveArr(LS_UC,userConf); return 'ok';
    }
    if(it.type==='vocab'){
      if(!it.word||!it.meaning) return 'bad';
      if(userVocab.some(function(u){return u.word===it.word&&u.meaning===it.meaning;})) return 'skip';
      userVocab.push({id:'u'+ts, word:it.word, phonetic:it.phonetic||'', pos:it.pos||'', meaning:it.meaning, colloc:it.colloc||'', source:it.source||'导入', mine:true}); saveArr(LS_UV,userVocab); return 'ok';
    }
    if(it.type==='longsentence'){
      if(!it.sentence) return 'bad';
      if(userLong.some(function(u){return u.sentence===it.sentence;})) return 'skip';
      userLong.push({sentence:it.sentence, parse:it.parse||'', translation:it.translation||'', mine:true}); saveArr(LS_UL,userLong); return 'ok';
    }
    if(it.type==='reading'||it.type==='cloze'){ return 'nosupport'; }
    return 'bad';
  }
  function runIntake(){

    var raw=(ta.value||'').trim(); if(!raw){ msg.style.color='#c62828'; msg.textContent='❌ 请先粘贴 JSON 或选择文件。'; return; }
    var data; try{ data=JSON.parse(raw); }catch(e){ msg.style.color='#c62828'; msg.textContent='❌ JSON 解析失败：'+e.message; return; }
    if(!data||!Array.isArray(data.items)){ msg.style.color='#c62828'; msg.textContent='❌ 格式错误：顶层需含 items 数组。'; return; }
    if(data.subject&&data.subject!=='英语'){ msg.style.color='#c62828'; msg.textContent='⚠️ 本页是英语，但 JSON 的 subject='+data.subject+'，已跳过（请到对应科目页导入）。'; return; }
    var ok=0,skip=0,bad=0,nosup=0;
    (data.items||[]).forEach(function(it){
      try{ if(!it||!it.type){ bad++; return; } var r=importEItem(it); if(r==='ok') ok++; else if(r==='skip') skip++; else if(r==='nosupport') nosup++; else bad++; }catch(e){ bad++; }
    });
    msg.style.color='#2e7d32';
    msg.textContent='✅ 导入完成：新增 '+ok+' 条，跳过重复 '+skip+' 条，不支持(阅读/七选五无对应页) '+nosup+' 条，无效 '+bad+' 条。可切到对应标签页查看（红色"·我的"标记即导入内容）。';
    render();
  }

  function commitIntake(items){
    var ok=0,skip=0,bad=0;
    items.forEach(function(it){
      var e=null;
      if(it.type==='vocab') e={type:'vocab', word:it.title, meaning:it.content};
      else if(it.type==='phrases') e={type:'phrases', phrase:it.title, meaning:it.content};
      else if(it.type==='longsentence') e={type:'longsentence', sentence:it.title, translation:it.content, parse:''};
      else e={type:'raw', title:it.title||'导入文档', content:it.content};
      try{ var r=importEItem(e); if(r==='ok') ok++; else if(r==='skip') skip++; else bad++; }catch(ex){ bad++; }
    });
    var msg=document.getElementById('intakeMsg'); if(msg){ msg.style.color='#2e7d32'; msg.textContent='✅ 文档导入完成：新增 '+ok+' 条，跳过重复 '+skip+' 条，无效 '+bad+' 条（词汇/短语/长难句已进对应模块；其余存「导入文档」原文）。'; }
    render(); renderEngDocList();
  }
  function commitRaw(text, name){
    var r=importEItem({type:'raw', title:(name||'导入文档').replace(/\.[^.]+$/,'')||'导入原文', content:text});
    var msg=document.getElementById('intakeMsg'); if(msg){ msg.style.color='#2e7d32'; msg.textContent=(r==='ok'?'✅ 已整篇存入「导入文档」原文：':'⚠️ 整篇导入：')+(name||''); }
    render(); renderEngDocList();
  }
  var iie=document.getElementById('intakeExample'); if(iie) iie.onclick=function(){ intakeExample(); };

  // 移动端抽屉
  document.getElementById('menuBtn').onclick=function(){
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('scrim').classList.toggle('show');
  };
  document.getElementById('scrim').onclick=function(){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('scrim').classList.remove('show');
  };

  // 初始渲染（defer 数据脚本后，等 DOMContentLoaded 保证数据已就绪，避免首屏白屏/闪烁）
  function boot(){
    var sk=document.getElementById('bootSkel'); if(sk) sk.remove();
    D = window.POLITICS || {};
    if(!window.POLITICS){ var c=document.querySelector('.content'); if(c){ c.innerHTML='<div style="text-align:center;padding:48px;color:#c0392b">⚠️ 数据加载失败，请刷新页面重试（english_data.js 未正常加载）。</div>'; } return; }
    render();
    var c=document.querySelector('.content'); if(c){ c.style.opacity='0'; requestAnimationFrame(function(){ c.style.transition='opacity .35s ease'; c.style.opacity='1'; }); }
  }
  if(document.readyState!=='loading'){ boot(); } else { document.addEventListener('DOMContentLoaded', boot); }
})();
</script>
  <script src="brand.js"></script>
</body>
